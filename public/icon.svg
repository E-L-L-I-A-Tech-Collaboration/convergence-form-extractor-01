<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e233d" />
      <stop offset="70%" stop-color="#07101d" />
      <stop offset="100%" stop-color="#03070e" />
    </radialGradient>
    <radialGradient id="goldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer Glow Halo -->
  <circle cx="256" cy="256" r="210" fill="url(#goldAura)" />

  <!-- Outer Concentric Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 8" opacity="0.4" />
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#goldLine)" stroke-width="3" opacity="0.85" filter="url(#glow)" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#818cf8" stroke-width="1.8" opacity="0.6" />

  <!-- 12-Fold Sacred Flower of Life Lotus Petals -->
  <g transform="translate(256, 256)" stroke="url(#goldLine)" stroke-width="1.8" fill="#f59e0b" fill-opacity="0.08" opacity="0.75">
    <circle cx="0" cy="-70" r="70" />
    <circle cx="60.6" cy="-35" r="70" />
    <circle cx="60.6" cy="35" r="70" />
    <circle cx="0" cy="70" r="70" />
    <circle cx="-60.6" cy="35" r="70" />
    <circle cx="-60.6" cy="-35" r="70" />
  </g>

  <!-- Interlocking Sri Yantra Triangles -->
  <polygon points="256,96 390,328 122,328" fill="none" stroke="url(#primaryGrad)" stroke-width="4.5" filter="url(#glow)" />
  <polygon points="256,416 122,184 390,184" fill="none" stroke="url(#goldLine)" stroke-width="4.5" filter="url(#glow)" />
  <polygon points="256,136 360,316 152,316" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.85" />
  <polygon points="256,376 152,196 360,196" fill="none" stroke="#c084fc" stroke-width="2.5" opacity="0.85" />

  <!-- Inner Bindu Point & Core Pulsar -->
  <circle cx="256" cy="256" r="26" fill="url(#goldLine)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="12" fill="#ffffff" />
  <circle cx="256" cy="256" r="5" fill="#f59e0b" />
</svg>
